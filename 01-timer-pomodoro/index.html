<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="css/timer.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <div id="timer">
        <nav class="options">
            <div class="modesGroup">
                <button class="modeButton">Focus Mode</button>
                <button class="modeButton">Short break</button>
                <button class="modeButton">Long break</button>
            </div>
            <div class="settings-wrapper">
                <button id="openSettings" aria-label="Configurações">
                    <i data-lucide="settings"></i>
                </button>

                <div class="time-settings" id="timeSettings">
                    <p>Time Settings</p>
                    <div id="inputFields">

                        <label for="focusInput" class="inputLabels">Focus</label>
                        <label for="shortInput" class="inputLabels">Short</label>
                        <label for="longInput" class="inputLabels">Long</label>
                        <input type="text" class="inputDefaultTime" id="focusInput">

                        <input type="text" class="inputDefaultTime" id="shortInput">

                        <input type="text" class="inputDefaultTime" id="longInput">
                    </div>

                </div>
            </div>
        </nav>
        <span id="timeField"></span>
        <div class="buttonsWrapper">
            <button id="startTimerButton"><i data-lucide="play"></i></button>
            <button id="pauseTimerButton"><i data-lucide="pause"></i></button>
            <button id="restartTimerButton"><i data-lucide="rotate-ccw"></i></button>
        </div>
    </div>

    <script src="js/timer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons()
    </script>
</body>
</html>
