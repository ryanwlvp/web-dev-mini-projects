<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="timer.css">
</head>
<body>
    <div id="timer">
        <nav class="options">
            <div class="modesGroup">
                <button class="modeButton">Focus Mode</button>
                <button class="modeButton">Short break</button>
                <button class="modeButton">Long break</button>
            </div>
            <button id="openSettings"><i data-lucide="settings" aria-label="Configurações"></i></button>
        </nav>
        <span id="timeField"></span>
        <div class="buttonsWrapper">
            <button id="startTimerButton">Start</button>
            <button id="pauseTimerButton">Pause</button>
            <button id="restartTimerButton">Restart</button>
        </div>
    </div>

    <script src="timer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons()
    </script>
</body>
</html>
