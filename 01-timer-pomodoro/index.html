<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="css/timer.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <div id="timer">
        <nav class="options">
            <div class="modesGroup">
                <button class="modeButtons" id="focusButton" data-mode="focus">Focus Mode</button>
                <button class="modeButtons" id="shortBreakButton" data-mode="short">Short break</button>
                <button class="modeButtons" id="longBreakButton" data-mode="long">Long break</button>
            </div>
            <div class="settings-wrapper">
                <button id="openSettings" aria-label="Settings">
                    <i data-lucide="settings"></i>
                </button>

                <div class="time-settings" id="timeSettings">
                    <p>Time Settings</p>
                    <div id="inputFields">

                        <label for="focusInput" class="inputLabels">Focus</label>
                        <label for="shortInput" class="inputLabels">Short</label>
                        <label for="longInput" class="inputLabels">Long</label>
                        <input type="number" class="inputDefaultTime" id="focusInput" min="1" max="999">

                        <input type="number" class="inputDefaultTime" id="shortInput" min="1" max="999">

                        <input type="number" class="inputDefaultTime" id="longInput" min="1" max="999">
                        
                        <button id="closeSettings" aria-label="Close Settings Window">Close</button>
                        <button id="saveSettings" aria-label="Save Settings">Save</button>
                    </div>

                </div>
            </div>
        </nav>
        <span id="timeField"></span>
        <div class="buttonsWrapper">
            <button id="startTimerButton" aria-label="Start"><i data-lucide="play"></i></button>
            <button id="pauseTimerButton" aria-label="Pause"><i data-lucide="pause"></i></button>
            <button id="restartTimerButton" aria-label="Restart"><i data-lucide="rotate-ccw"></i></button>
        </div>
    </div>

    <script src="js/timer.js"></script>
    <script src="js/settings.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons()
    </script>
</body>
</html>
