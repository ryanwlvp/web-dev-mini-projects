<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="page">
        <header id="introduction">
            <h1>My Tasks</h1>
            <p>Take it easy. Stay focused.</p>
        </header>
        <main>
            <label for="input-task">Add your task</label>
            <form id="input-field">
                <input type="text" id="input-task" placeholder="Enter your task here">
                <button id="add-task">Add Task</button>
            </form>
        
        </main>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
